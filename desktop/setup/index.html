<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>智学课堂设置</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true">智</div>
        <div>
          <div class="eyebrow">智学课堂 · 桌面版</div>
          <h1 id="page-title">用一个 DeepSeek Key 开始使用</h1>
          <p id="page-description">完成一次设置，以后打开软件就能直接学习和创作课堂。</p>
        </div>
      </header>

      <section class="notice">
        <strong>使用前说明</strong>
        <p>
          这是基于清华大学 OpenMAIC 开源项目适配的非官方桌面发行版。你输入的课题和文档内容会发送给
          DeepSeek 生成课堂，API 费用由你的 DeepSeek 账户承担。
        </p>
      </section>

      <form id="setup-form" novalidate>
        <fieldset>
          <legend>1. 你主要用来做什么？</legend>
          <div class="choice-grid scene-grid">
            <label class="choice"><input type="radio" name="usageScene" value="self-study" checked /><span><b>自主学习</b><small>理解课本、论文和新知识</small></span></label>
            <label class="choice"><input type="radio" name="usageScene" value="family" /><span><b>家庭辅导</b><small>陪孩子学习与复习</small></span></label>
            <label class="choice"><input type="radio" name="usageScene" value="teaching" /><span><b>教学备课</b><small>把资料转成互动课堂</small></span></label>
            <label class="choice"><input type="radio" name="usageScene" value="career" /><span><b>职业学习</b><small>培训、证书与业务资料</small></span></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>2. 默认讲解深度</legend>
          <div class="choice-grid level-grid">
            <label class="choice compact"><input type="radio" name="knowledgeLevel" value="beginner" checked /><span><b>入门</b><small>多举例，少术语</small></span></label>
            <label class="choice compact"><input type="radio" name="knowledgeLevel" value="intermediate" /><span><b>进阶</b><small>兼顾原理与实践</small></span></label>
            <label class="choice compact"><input type="radio" name="knowledgeLevel" value="advanced" /><span><b>专业</b><small>保留细节与术语</small></span></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>3. 连接 DeepSeek</legend>
          <div class="field-row">
            <label class="field grow">
              <span>API Key</span>
              <div class="password-wrap">
                <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-..." />
                <button id="toggle-key" class="text-button" type="button" aria-label="显示或隐藏密钥">显示</button>
              </div>
              <small id="key-hint">密钥仅加密保存在这台 Windows 电脑中。</small>
            </label>
          </div>
          <div class="field-row two-columns">
            <label class="field">
              <span>模型</span>
              <select id="model">
                <option value="deepseek-v4-flash">DeepSeek V4 Flash（推荐，更经济）</option>
                <option value="deepseek-v4-pro">DeepSeek V4 Pro（更强，费用更高）</option>
              </select>
            </label>
            <label class="field">
              <span>API 地址</span>
              <input id="base-url" type="url" value="https://api.deepseek.com" spellcheck="false" />
            </label>
          </div>
          <div class="provider-actions">
            <button id="open-console" class="link-button" type="button">没有 Key？去 DeepSeek 创建</button>
            <button id="test-button" class="secondary-button" type="button">测试连接</button>
          </div>
        </fieldset>

        <div id="status" class="status" role="status" aria-live="polite"></div>

        <footer>
          <div class="version" id="version"></div>
          <div class="footer-actions">
            <button id="cancel-button" class="ghost-button" type="button">取消</button>
            <button id="save-button" class="primary-button" type="submit">保存并进入智学课堂</button>
          </div>
        </footer>
      </form>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
